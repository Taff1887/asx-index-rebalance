[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asx-index-rebalance-forecast"
version = "0.1.0"
description = "Forecast S&P/ASX 50/100/200 index rebalances and backtest a tradeable strategy versus buy-and-hold ASX 200"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taffy Jackson" }]
keywords = ["quant", "asx", "index rebalance", "passive flow", "event study", "backtest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.0", "shap>=0.44"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.6"]
all = [
    "xgboost>=2.0", "lightgbm>=4.0", "shap>=0.44",
    "streamlit>=1.30", "plotly>=5.18",
    "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.6",
]

[project.scripts]
asxrebalance = "asxrebalance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asxrebalance = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
